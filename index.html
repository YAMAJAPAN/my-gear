<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>YAMA | Gears</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(10, 10, 10, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #71717a;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Geist', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .navbar {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .x-link {
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-decoration: none;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: 0.2s;
        }
        .x-link:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }
        .x-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .nav-title {
            font-weight: 900;
            font-size: 1.25rem;
            letter-spacing: 0.1em;
            color: #fff;
        }
        .nav-profile {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-profile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .page-title {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }
        .tab-wrapper {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 1rem;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .grid-section {
            margin-bottom: 2.5rem;
        }
        .section-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #e5e7eb;
        }
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.25rem;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.2s;
        }
        .card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .card-text .brand {
            font-size: 0.75rem;
            color: var(--accent-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .card-text h3 {
            font-size: 1rem;
            font-weight: 700;
            margin: 0.25rem 0 0.5rem 0;
            color: #fff;
        }
        .card-price {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }
        .card-specs {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0 0.75rem 0;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.4;
        }
        .card-specs li {
            margin-bottom: 0.15rem;
        }
        .card-img-wrapper {
            width: 100%;
            height: 130px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 0.5rem;
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: var(--text-muted);
            font-size: 0.75rem;
            overflow: hidden;
            position: relative;
        }
        .card-img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .gallery-viewport {
            overflow: hidden;
            width: 100%;
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.25rem;
            backdrop-filter: blur(12px);
        }
        .gallery-track {
            display: flex;
            gap: 1.25rem;
            width: max-content;
            animation: scrollGallery 25s linear infinite;
        }
        .gallery-track:hover {
            animation-play-state: paused;
        }
        .gallery-item {
            width: 320px;
            height: 200px;
            object-fit: cover;
            border-radius: 0.75rem;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.2s, border-color 0.2s;
            background: rgba(0, 0, 0, 0.6);
        }
        .gallery-item:hover {
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.4);
        }
        @keyframes scrollGallery {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-50% - 0.625rem)); }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content-wrap {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }
        .modal-img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 0.75rem;
            object-fit: contain;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .modal-close-btn {
            position: absolute;
            top: -45px;
            right: 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: 0.2s;
        }
        .modal-close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .spec-table {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }
        .spec-cell {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1rem;
            border-radius: 0.75rem;
        }
        .spec-cell dt {
            font-size: 0.75rem;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .spec-cell dd {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0;
            color: #fff;
        }
        /* GPUなどの上下配置用スタイル */
        .spec-main {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
        }
        .spec-sub {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 0.15rem;
        }

        .game-block {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .game-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #fff;
        }
        .game-values {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }
        .game-value {
            background: rgba(255, 255, 255, 0.03);
            padding: 0.75rem;
            border-radius: 0.5rem;
            text-align: center;
        }
        .game-value-num {
            display: block;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }
        .game-value-label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- ナビゲーションバー -->
    <nav class="navbar">
        <div class="nav-brand">
            <div class="nav-profile" aria-label="Profile Icon">
                <img src="https://pbs.twimg.com/profile_images/2114342559959199745/d6f5cKYd_400x400.jpg" alt="Profile">
            </div>
            <span class="nav-title">YAMA</span>
        </div>
        <a href="https://twitter.com/RX9070XT" target="_blank" rel="noopener" class="x-link" aria-label="X Profile">
            <img src="https://img.magnific.com/free-vector/new-2023-twitter-logo-x-icon-design_1017-45418.jpg?semt=ais_hybrid&w=740&q=80" alt="X Profile">

        <div class="content-area">

            <div id="gears" class="tab-content active">
                
                <!-- Keyboards -->
                <div class="grid-section">

                    <div class="bento-grid">

                        </div>
                        <div class="card">
                            <div class="card-header-row">
                                <div class="card-text">
                                    <span class="brand">CORSAIR</span>
                                    <h3>K70 RGB TKL CHAMPION OPX</h3>
                                </div>
                                <span class="card-price">¥16,000</span>
                            </div>
                            <ul class="card-specs">
                                <li>- CH-9911060-JP</li>
                            </ul>
                            <div class="card-img-wrapper"><img src="https://assets.corsair.com/image/upload/c_pad,q_85,h_1100,w_1100,f_auto/products/Gaming-Keyboards/CH-911901A-JP/Gallery/CH-911901A-JP_01.webp" alt="CORSAIR Keyboard"></div>
                        </div>
                        <div class="card">
                            <div class="card-header
